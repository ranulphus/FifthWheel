# budget.cfg - Fifth Wheel's detail presets (BUDGET.CFG beside FWHEEL.EXE).
# The same numbers are built in; this file overrides them, so measurements
# on real machines can retune a preset without a new build (docs/perf.md).
#
#   far           metres: the far plane, and the world's reach round the target
#   zoom_max      the furthest camera zoom allowed: 0 near, 1 normal, 2 far
#   coins, confetti, dust   flourishes at once (at most 16, 64, 32)
#   minimap_step  road points (8 m apart) one minimap segment spans
#   trailers      metres within which standing trailers are drawn

low.far = 110
low.zoom_max = 1
low.coins = 8
low.confetti = 24
low.dust = 12
low.minimap_step = 4
low.trailers = 110

medium.far = 140
medium.zoom_max = 2
medium.coins = 12
medium.confetti = 48
medium.dust = 24
medium.minimap_step = 3
medium.trailers = 160

high.far = 180
high.zoom_max = 2
high.coins = 16
high.confetti = 64
high.dust = 32
high.minimap_step = 2
high.trailers = 220
