# budget.cfg - Fifth Wheel's detail presets (BUDGET.CFG beside FWHEEL.EXE).
# The same numbers are built in; this file overrides them, so measurements
# on real machines can retune a preset without a new build (docs/perf.md).
#
#   far           metres: the far plane, and the world's reach round the target
#   far_engine    metres: the far plane instead where the card's transform engine
#                 does the work (the Radeon 7500 and 7200: GL_DGL_hw_tnl); 0 or
#                 absent: far. HIGH's 400: the engine's gain spent on distance
#                 (P3, Radeon 7500, far zoom: the busiest second 53 fps at 180 to
#                 400 m against 43 without the engine; the average 69.8 against
#                 68.6 at 180 m without it; the owner chose 400, 2026-11-27)
#   zoom_max      the furthest camera zoom allowed: 0 near, 1 normal, 2 far
#   coins, confetti, dust   flourishes at once (at most 16, 64, 32)
#   minimap_step  road points (8 m apart) one minimap segment spans
#   trailers      metres within which standing trailers are drawn
#   models        how round the lorry is: 0 boxes, 1 rounded, 2 rounder
#   pitch_min     degrees down the camera comes to at speed (64 when still;
#                 under about 30 the sky shows, with fog towards the far plane)
#   fog           1: GL fog towards the far plane when the camera sees that far;
#                 0: a haze drawn on the screen instead (DOS-GL's fog multiplies
#                 the triangles the card draws: on the G400, 72.7 fps became 21.7);
#                 2: GL fog only where the card's transform engine fogs (the
#                 Radeon 7500 and 7200: GL_DGL_hw_tnl), else the haze

low.far = 110
low.zoom_max = 1
low.coins = 8
low.confetti = 24
low.dust = 12
low.minimap_step = 4
low.trailers = 110
low.models = 0
low.pitch_min = 52

medium.far = 140
medium.zoom_max = 2
medium.coins = 12
medium.confetti = 48
medium.dust = 24
medium.minimap_step = 3
medium.trailers = 160
medium.models = 1
medium.pitch_min = 24
medium.fog = 0

high.far = 180
high.far_engine = 400
high.zoom_max = 2
high.coins = 16
high.confetti = 64
high.dust = 32
high.minimap_step = 2
high.trailers = 220
high.models = 2
high.pitch_min = 20
high.fog = 2
